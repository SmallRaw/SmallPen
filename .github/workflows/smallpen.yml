name: CI
run-name: CI · ${{ github.ref_name }}
on:
  workflow_dispatch: {}
permissions:
  contents: read
concurrency:
  group: smallpen-ci
  cancel-in-progress: false
jobs:
  test:
    name: Test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      version: ${{ steps.release.outputs.version }}
      channel: ${{ steps.release.outputs.channel }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Read and validate committed version
        id: release
        run: node smallpen/scripts/release.mjs info >> "$GITHUB_OUTPUT"
      - name: Prepare package metadata
        env:
          VERSION: ${{ steps.release.outputs.version }}
          CHANNEL: ${{ steps.release.outputs.channel }}
        run: node smallpen/scripts/release.mjs prepare "$VERSION" "$CHANNEL"
      - run: npm ci --ignore-scripts
        working-directory: smallpen
      - run: npm audit --omit=dev --audit-level=high
        working-directory: smallpen
      - run: npm test
        working-directory: smallpen
  cli:
    name: CLI (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14, windows-2025]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare package metadata
        env:
          VERSION: ${{ needs.test.outputs.version }}
          CHANNEL: ${{ needs.test.outputs.channel }}
        run: node smallpen/scripts/release.mjs prepare "$VERSION" "$CHANNEL"
      - run: npm ci --ignore-scripts
        working-directory: smallpen
      - name: Pack four public npm packages
        env:
          VERSION: ${{ needs.test.outputs.version }}
          CHANNEL: ${{ needs.test.outputs.channel }}
        run: node smallpen/scripts/release.mjs pack smallpen/dist/npm "$VERSION" "$CHANNEL" "$GITHUB_SHA"
      - name: Verify clean global install and smallpen command
        run: node smallpen/scripts/release.mjs smoke smallpen/dist/npm "$GITHUB_SHA"
      - name: Build standalone CLI
        working-directory: smallpen
        run: |
          npm run build:cli
          node ./dist/SmallPen-CLI/app/apps/cli/bin/smallpen-check.cjs --help
          cp dist/npm/manifest.json dist/SmallPen-CLI/release.json
          tar -czf dist/SmallPen-CLI.tar.gz -C dist SmallPen-CLI
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: smallpen-npm-${{ github.sha }}-${{ github.run_id }}
          path: smallpen/dist/npm/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Linux'
        with:
          name: SmallPen-CLI-${{ needs.test.outputs.version }}-${{ github.sha }}-${{ github.run_id }}
          path: smallpen/dist/SmallPen-CLI.tar.gz
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  frontend:
    name: Frontend
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Build frontend once
        env:
          BUILD_WASM: "yes"
        run: ./manage.sh build-frontend-bundle
      - uses: actions/upload-artifact@v7
        with:
          name: smallpen-frontend-${{ github.sha }}-${{ github.run_id }}
          path: bundles/frontend/
          if-no-files-found: error
          retention-days: 1
          overwrite: true
  desktop:
    name: Desktop (${{ matrix.platform }})
    needs: [test, frontend]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            platform: macOS
          - os: windows-2025
            platform: Windows
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Prepare package metadata
        env:
          VERSION: ${{ needs.test.outputs.version }}
          CHANNEL: ${{ needs.test.outputs.channel }}
        run: node smallpen/scripts/release.mjs prepare "$VERSION" "$CHANNEL"
      - run: npm ci --ignore-scripts
        working-directory: smallpen
      - uses: actions/download-artifact@v7
        with:
          name: smallpen-frontend-${{ github.sha }}-${{ github.run_id }}
          path: frontend/resources/public
      - name: Install locked desktop build tools (no lifecycle scripts)
        run: npm ci --ignore-scripts --workspaces=false --prefix smallpen/apps/desktop/tools
      - name: Check desktop build tool advisories
        run: npm audit --audit-level=high --workspaces=false --prefix smallpen/apps/desktop/tools
      - name: Build Electron Desktop
        working-directory: smallpen
        run: npm run --workspace @smallpen/desktop build
      - name: Archive macOS build (smoke test follows)
        if: runner.os == 'macOS'
        working-directory: smallpen/apps/desktop/dist
        run: |
          ditto -c -k --sequesterRsrc --keepParent SmallPen.app SmallPen-macOS-arm64-unsigned.zip
          shasum -a 256 SmallPen-macOS-arm64-unsigned.zip > SHA256SUMS
          printf '%s\n' "$GITHUB_SHA" > SOURCE_COMMIT
      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS'
        with:
          name: SmallPen-macOS-arm64-${{ needs.test.outputs.version }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            smallpen/apps/desktop/dist/SmallPen-macOS-arm64-unsigned.zip
            smallpen/apps/desktop/dist/SHA256SUMS
            smallpen/apps/desktop/dist/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Archive Windows
        if: runner.os == 'Windows'
        shell: pwsh
        working-directory: smallpen/apps/desktop/dist
        run: |
          Compress-Archive -Path SmallPen-Windows-x64 -DestinationPath SmallPen-Windows-x64.zip
          $digest = (Get-FileHash SmallPen-Windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$digest  SmallPen-Windows-x64.zip" | Set-Content SHA256SUMS
          $env:GITHUB_SHA | Set-Content SOURCE_COMMIT
      - uses: actions/upload-artifact@v7
        if: runner.os == 'Windows'
        with:
          name: SmallPen-Windows-x64-${{ needs.test.outputs.version }}-${{ github.sha }}-${{ github.run_id }}
          path: |
            smallpen/apps/desktop/dist/SmallPen-Windows-x64.zip
            smallpen/apps/desktop/dist/SHA256SUMS
            smallpen/apps/desktop/dist/SOURCE_COMMIT
          if-no-files-found: error
          retention-days: 1
          overwrite: true
      - name: Test the packaged App
        id: smoke
        env:
          SMALLPEN_SMOKE_EVIDENCE: ${{ runner.temp }}/smallpen-desktop-evidence
        run: node smallpen/e2e/desktop-smoke.mjs
      - name: Upload desktop test evidence
        if: ${{ failure() && steps.smoke.outcome == 'failure' }}
        uses: actions/upload-artifact@v7
        with:
          name: SmallPen-Desktop-test-${{ matrix.platform }}-${{ github.sha }}-${{ github.run_id }}
          path: ${{ runner.temp }}/smallpen-desktop-evidence/
          if-no-files-found: warn
          retention-days: 1
          overwrite: true
  publish:
    name: Publish
    needs: [test, cli, desktop]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - uses: actions/download-artifact@v7
        with:
          name: smallpen-npm-${{ github.sha }}-${{ github.run_id }}
          path: smallpen/dist/npm
      - name: Publish exact verified tarballs using npm trusted publishing
        run: node smallpen/scripts/release.mjs publish smallpen/dist/npm "$GITHUB_SHA"
  cleanup:
    name: Remove intermediate artifacts
    needs: [cli, frontend, desktop, publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Delete only this run's frontend and npm transfer artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          NPM_ARTIFACT: smallpen-npm-${{ github.sha }}-${{ github.run_id }}
          FRONTEND_ARTIFACT: smallpen-frontend-${{ github.sha }}-${{ github.run_id }}
        run: |
          gh api --paginate "repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.name == env.NPM_ARTIFACT or .name == env.FRONTEND_ARTIFACT) | .id' > artifact-ids.txt
          while IFS= read -r artifact_id; do
            [[ "$artifact_id" =~ ^[0-9]+$ ]] || exit 1
            gh api --method DELETE "repos/$REPO/actions/artifacts/$artifact_id"
          done < artifact-ids.txt
