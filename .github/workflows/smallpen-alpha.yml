name: SmallPen Alpha

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Build Penpot frontend
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Build frontend bundle
        env:
          BUILD_WASM: "yes"
        run: ./manage.sh build-frontend-bundle

      - name: Upload frontend for Desktop packaging
        uses: actions/upload-artifact@v7
        with:
          name: smallpen-frontend-${{ github.sha }}
          path: bundles/frontend/
          if-no-files-found: error
          retention-days: 2

  cli:
    name: Test and package CLI
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smallpen/package-lock.json

      - name: Materialize SmallPen workspace
        working-directory: smallpen
        run: npm ci --ignore-scripts

      - name: Test SmallPen
        working-directory: smallpen
        run: npm test

      - name: Build CLI Alpha
        working-directory: smallpen
        run: npm run build:cli

      - name: Verify packaged CLI
        working-directory: smallpen
        run: ./dist/SmallPen-CLI/smallpen --help

      - name: Archive CLI Alpha
        working-directory: smallpen
        run: tar -czf SmallPen-CLI.tar.gz -C dist SmallPen-CLI

      - name: Upload CLI Alpha
        uses: actions/upload-artifact@v7
        with:
          name: SmallPen-CLI-${{ github.sha }}
          path: smallpen/SmallPen-CLI.tar.gz
          if-no-files-found: error
          retention-days: 2

  desktop:
    name: Build unsigned macOS arm64 App
    needs: frontend
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: smallpen/package-lock.json

      - name: Materialize SmallPen workspace
        working-directory: smallpen
        run: npm ci --ignore-scripts

      - name: Download compiled frontend
        uses: actions/download-artifact@v7
        with:
          name: smallpen-frontend-${{ github.sha }}
          path: frontend/resources/public

      - name: Build unsigned App
        working-directory: smallpen
        run: npm run --workspace @smallpen/desktop build:macos

      - name: Smoke-test unsigned App
        working-directory: smallpen
        run: npm run test:desktop

      - name: Archive App
        working-directory: smallpen/apps/desktop/dist
        run: ditto -c -k --sequesterRsrc --keepParent SmallPen.app SmallPen-macOS-arm64-unsigned.zip

      - name: Upload unsigned App
        uses: actions/upload-artifact@v7
        with:
          name: SmallPen-macOS-arm64-unsigned-${{ github.sha }}
          path: smallpen/apps/desktop/dist/SmallPen-macOS-arm64-unsigned.zip
          if-no-files-found: error
          retention-days: 2
