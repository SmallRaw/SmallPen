<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Design System Fixture</title>
  <link rel="stylesheet" href="../tokens.css">
</head>
<body data-name="Fixture Canvas" class="w-[400px] h-[400px] bg-[#f4f4f5]">
  <div data-shape="rectangle" data-name="Primary Swatch" class="left-[40px] top-[40px] w-[120px] h-[80px] bg-[#6750a4]"></div>
  <div data-shape="rectangle" data-name="Radius Swatch" class="left-[40px] top-[160px] w-[120px] h-[80px] bg-[#0ea5e9]"></div>
  <sp-use component="Card" data-name="Card instance / idle" class="left-[200px] top-[40px] w-[200px] h-[120px]"></sp-use>
  <sp-use component="Card" props="State: pressed" data-name="Card instance / pressed" class="left-[200px] top-[200px] w-[200px] h-[120px]"></sp-use>
  <div data-shape="rectangle" data-name="Hardcoded Radius Control" class="left-[200px] top-[330px] w-[200px] h-[120px] bg-[#94a3b8] rounded-[12px]"></div>
</body>
</html>
